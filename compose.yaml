services:
  # ------------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: s3gw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gateway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-gateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"                    
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ------------------------------------------------------------
  # MinIO (S3)
  # ------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: s3gw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ------------------------------------------------------------
  # HTTP-шлюз
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    image: s3-gateway:dev
    container_name: s3gw-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app
    networks:
      - backend

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  pgdata:
  miniodata:

networks:
  backend:
    driver: bridge